<script>
  // Redirect legacy post URLs (e.g. /post/my-title/) to the new
  // permalink structure (e.g. /my-title/).
  (function () {
    var path = window.location.pathname;
    var match = path.match(/^\/post\/(.*)$/);
    if (match) {
      window.location.replace(
        "/" + match[1] + window.location.search + window.location.hash
      );
    }
  })();
</script>
