{% if cache_bust == nil %}
{% assign cache_bust = site.time | date: "%Y%m%d%H%M%S" %}
{% endif %}

<style>
    .lunrsearchresult .title {color: #d9230f;}
    .lunrsearchresult .url {color: silver;}
    .lunrsearchresult a {display: block; color: #777;}
    .lunrsearchresult a:hover, .lunrsearchresult a:focus {text-decoration: none;}
    .lunrsearchresult a:hover .title {text-decoration: underline;}
</style>


<form class="bd-search" id="lunrsearchform">
    <input type="text" class="form-control text-small launch-modal-search" id="lunrsearch" name="q" maxlength="255" value="" placeholder="Type and enter..." aria-label="Search this site"/>
</form>

<div id="lunrsearchresults">
</div>

<script defer src="{{site.baseurl}}/assets/js/lunrsearchengine.js?v={{ cache_bust }}"></script>
